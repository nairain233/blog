name: Post Memo

on:
  workflow_dispatch:
    inputs:
      content:
        description: "Memo 内容（在输入框中用 \\n 或 %0A 表示换行，支持 Markdown）"
        required: true
        type: string
      tags:
        description: "标签（英文逗号分隔，例如：折腾,感悟）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  post-memo:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 生成 UTC+8 时间
        id: dt
        run: echo "memo_date=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: 更新 memos 文件
        env:
          MEMO_CONTENT: ${{ github.event.inputs.content }}
          MEMO_TAGS: ${{ github.event.inputs.tags }}
          MEMO_DATE: ${{ steps.dt.outputs.memo_date }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const filePath = "src/data/memos.json";
          const decodeMultiline = (value) => {
            return (value || "")
              .replace(/\r\n/g, "\n")
              .replace(/\r/g, "\n")
              .replace(/%0D%0A/gi, "\n")
              .replace(/%0A/gi, "\n")
              .replace(/\\n/g, "\n")
              .trim();
          };

          const memoContentRaw = decodeMultiline(process.env.MEMO_CONTENT);
          const memoTagsRaw = (process.env.MEMO_TAGS || "").replace(/\r\n/g, "\n");
          const memoDate = process.env.MEMO_DATE;

          if (!memoContentRaw) {
            throw new Error("输入项 content 为空。");
          }

          const tags = memoTagsRaw
            .split(/[\n,]/)
            .map((tag) => tag.trim())
            .filter(Boolean);

          const newItem = {
            date: memoDate,
            content: memoContentRaw,
            tags,
          };

          const raw = fs.readFileSync(filePath, "utf8");
          const memos = JSON.parse(raw);
          if (!Array.isArray(memos)) {
            throw new Error(`在 ${filePath} 中未找到 JSON 数组`);
          }

          memos.unshift(newItem);

          fs.writeFileSync(filePath, `${JSON.stringify(memos, null, "\t")}\n`, "utf8");
          NODE

      - name: 提交并推送变更
        env:
          MEMO_DATE: ${{ steps.dt.outputs.memo_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/memos.json

          if git diff --staged --quiet; then
            echo "没有可提交的变更。"
            exit 0
          fi

          git commit -m "chore(memos): add memo at ${MEMO_DATE}"
          git push